<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sport"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<title>Programme de sport</title>
<meta name="theme-color" content="#16191B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>/* Layout : carnet sobre. Ordinateur = colonne de navigation fine + colonne de travail ;
   téléphone = en-tête compact + onglets en bas. Filets fins plutôt qu'ombres, une seule couleur d'accent par thème. */
:root{
  --body-base:#E4E7E2; --body-m:#D2D7D0; --mus-1:#C4573E; --mus-2:#EBB8A9; --ground:#F4F5F3; --surface:#FFFFFF; --surface-2:#F8F9F7; --surface-3:#ECEEEA;
  --line:#E2E5E0; --line-2:#CDD2CB;
  --ink:#16191B; --ink-2:#50585C; --ink-3:#848C8F;
  --accent:#2E4A62; --accent-deep:#223A4F; --accent-soft:#E6ECF1; --on-accent:#FFFFFF;
  --cat-mob:#4E7D74; --cat-reh:#9A6A4B; --cat-mus:#536C9A; --cat-pro:#7A6E98;
  --ok:#3F7A5A; --warn:#A97A2C; --crit:#A4473A;
  --shadow:0 1px 2px rgba(20,24,26,.04);
  --r:12px; --r-s:8px;
  --f-d:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-skin]){
    --body-base:#2A2D30; --body-m:#3A3E42; --mus-1:#E07A5F; --mus-2:#7E4D40; --ground:#111213; --surface:#18191B; --surface-2:#1C1E20; --surface-3:#25272A;
    --line:#2A2C2F; --line-2:#3A3D41; --ink:#E9E8E5; --ink-2:#A5A6A4; --ink-3:#77797A;
    --accent:#AFC0D2; --accent-deep:#CAD7E4; --accent-soft:#242C35; --on-accent:#111417;
    --cat-mob:#8DB5AB; --cat-reh:#CC9F80; --cat-mus:#93A9D3; --cat-pro:#B2A6D1;
    --ok:#7DBA97; --warn:#D3AA62; --crit:#DA8577; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-skin]),:root[data-skin="graphite"]{
  --body-base:#2A2D30; --body-m:#3A3E42; --mus-1:#E07A5F; --mus-2:#7E4D40; --ground:#111213; --surface:#18191B; --surface-2:#1C1E20; --surface-3:#25272A;
  --line:#2A2C2F; --line-2:#3A3D41; --ink:#E9E8E5; --ink-2:#A5A6A4; --ink-3:#77797A;
  --accent:#AFC0D2; --accent-deep:#CAD7E4; --accent-soft:#242C35; --on-accent:#111417;
  --cat-mob:#8DB5AB; --cat-reh:#CC9F80; --cat-mus:#93A9D3; --cat-pro:#B2A6D1;
  --ok:#7DBA97; --warn:#D3AA62; --crit:#DA8577; --shadow:none; color-scheme:dark;
}
:root[data-skin="porcelaine"]{color-scheme:light}
:root[data-skin="sable"]{
  --body-base:#E6E2DA; --body-m:#D5CFC3; --mus-1:#B5533A; --mus-2:#E6B8A5; --ground:#F2F0EC; --surface:#FBFAF7; --surface-2:#F6F4F0; --surface-3:#E9E6DF;
  --line:#E0DCD3; --line-2:#CBC5B9; --ink:#1F1D1A; --ink-2:#59544C; --ink-3:#8A8478;
  --accent:#55603F; --accent-deep:#434C31; --accent-soft:#E8EADF; --on-accent:#FFFFFF;
  --cat-mob:#5B7F70; --cat-reh:#9A6A4B; --cat-mus:#5A6E92; --cat-pro:#7E7094;
  --ok:#4E7A4F; --warn:#A27426; --crit:#9F4637; --shadow:0 1px 2px rgba(31,29,26,.04); color-scheme:light;
}
:root[data-skin="encre"]{
  --body-base:#EDEDED; --body-m:#D9D9D9; --mus-1:#111111; --mus-2:#8F8F8F; --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F0;
  --line:#E4E4E4; --line-2:#C9C9C9; --ink:#0A0A0A; --ink-2:#4A4A4A; --ink-3:#7E7E7E;
  --accent:#0A0A0A; --accent-deep:#000000; --accent-soft:#F0F0F0; --on-accent:#FFFFFF;
  --cat-mob:#5A5A5A; --cat-reh:#5A5A5A; --cat-mus:#5A5A5A; --cat-pro:#5A5A5A;
  --ok:#2F6B47; --warn:#8F6A1F; --crit:#9A3A2D; --shadow:none; color-scheme:light;
}
:root[data-skin="nuit"]{
  --body-base:#1E2737; --body-m:#2C3749; --mus-1:#E08A6A; --mus-2:#74503F; --ground:#0C111A; --surface:#121925; --surface-2:#161E2B; --surface-3:#1E2737;
  --line:#222C3C; --line-2:#323E52; --ink:#E5E8EE; --ink-2:#A1A9B6; --ink-3:#717B8A;
  --accent:#D2BC88; --accent-deep:#E4D2A8; --accent-soft:#2A2A28; --on-accent:#14110A;
  --cat-mob:#8DB5AB; --cat-reh:#CC9F80; --cat-mus:#93A9D3; --cat-pro:#B2A6D1;
  --ok:#7DBA97; --warn:#D3AA62; --crit:#DA8577; --shadow:none; color-scheme:dark;
}
:root[data-skin="foret"]{
  --body-base:#202A24; --body-m:#2E3A33; --mus-1:#E08A6A; --mus-2:#74503F; --ground:#0E1311; --surface:#141B17; --surface-2:#18201C; --surface-3:#202A24;
  --line:#25302A; --line-2:#36433B; --ink:#E4EAE6; --ink-2:#A2ADA6; --ink-3:#737F78;
  --accent:#A8C2AE; --accent-deep:#C4D8C8; --accent-soft:#1F2C24; --on-accent:#0D1410;
  --cat-mob:#8DB5AB; --cat-reh:#CC9F80; --cat-mus:#93A9D3; --cat-pro:#B2A6D1;
  --ok:#86BE98; --warn:#D3AA62; --crit:#DA8577; --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.55;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}

/* ---------- structure ---------- */
.side{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:11px;min-width:0;margin-right:auto}
.mark .logo{width:34px;height:34px;color:var(--ink);display:grid;place-items:center;flex:none;--logo-check:#B89A55}
.mark .logo svg{width:34px;height:34px}
.mark b{font-family:var(--f-d);font-weight:400;font-size:20px;letter-spacing:0;white-space:nowrap;line-height:1.1;display:block}
.mark small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:block}
.sync[data-s="cloud"] i{background:var(--ok)}
.sync[data-s="busy"] i{background:var(--warn)}
.sync[data-s="err"] i{background:var(--crit)}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.ibtn:hover{color:var(--ink);border-color:var(--line-2)}
.ibtn svg{width:17px;height:17px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(104px + env(safe-area-inset-bottom,0px))}
.page{max-width:900px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:6px 2px 4px;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;position:relative}
nav.tabs svg{width:21px;height:21px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-6px;left:32%;right:32%;height:2px;border-radius:2px;background:var(--accent)}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .mtop,nav.tabs{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:26px 14px 18px;gap:2px}
  .side .mark{margin:0 8px 28px}
  .side .navb{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--ink-2);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;text-align:left}
  .side .navb svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
  .side .navb:hover{color:var(--ink);background:var(--surface-3)}
  .side .navb[aria-selected="true"]{color:var(--ink);background:var(--surface)}
  .side .navb[aria-selected="true"]{box-shadow:inset 0 0 0 1px var(--line)}
  .side .navb[aria-selected="true"] svg{color:var(--accent)}
  .side .navb .k{margin-left:auto;font-size:11px;color:var(--ink-3)}
  .side .foot{margin-top:auto;display:grid;gap:2px;padding:14px 0 0;border-top:1px solid var(--line)}
  .side .foot button{background:none;border:0;color:var(--ink-2);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;text-align:left;display:flex;gap:10px;align-items:center}
  .side .foot button:hover{color:var(--ink);background:var(--surface-3)}
  .side .foot svg{width:15px;height:15px;color:var(--ink-3)}
  .side .sync{padding:8px 10px 0}
  main{padding-block:36px 72px;padding-left:44px;padding-right:44px}
}

/* ---------- éléments communs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.ph{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin:12px 0 22px}
.ph h1{font-family:var(--f-d);font-weight:400;font-size:clamp(34px,7vw,48px);line-height:1;letter-spacing:-.01em}
.ph .eyebrow{display:block;margin-bottom:10px}
.ph .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:34px 0 12px}
.sh h2{font-size:15px}
.sh .hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.sm{padding:6px 13px;font-size:12.5px;font-weight:500}
.btn svg{width:14px;height:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:transparent}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.c-mob .dot{background:var(--cat-mob)} .chip.c-reh .dot{background:var(--cat-reh)}
.chip.c-mus .dot{background:var(--cat-mus)} .chip.c-pro .dot{background:var(--cat-pro)}
.chip.carry{border-style:dashed;color:var(--ink-3)}
.chip.line{border-color:var(--line)}
.empty{padding:40px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-d);font-weight:400;font-size:24px;margin-bottom:6px}
.banner{padding:10px 12px;border-radius:var(--r-s);font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.5;border:1px solid var(--line);background:var(--surface)}
.banner svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--ink-3)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.banner.warn svg{color:var(--warn)}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));background:color-mix(in srgb,var(--crit) 5%,var(--surface))}
.banner.crit svg{color:var(--crit)}
.banner.info{color:var(--ink-2);border:0;background:transparent;padding:2px 0}
.consignes .banner.warn{background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.stack{display:grid;gap:8px}
select.f,input.f{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;min-width:0}
select.f:focus,input.f:focus{border-color:var(--accent);outline:none}

/* ---------- séance : synthèse ---------- */
.daynav{display:flex;gap:6px;align-items:center}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 24px;align-items:center;padding:20px 22px}
.hero .progs,.hero .acts{grid-column:1/-1}
@media (min-width:640px){.hero .progs,.hero .acts{grid-column:2}.hero .ring{grid-row:span 3}}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-family:var(--f-d);font-weight:400;font-size:38px;line-height:1}
.ring .in span{font-size:11px;color:var(--ink-3);margin-top:2px}
.hero .facts{display:flex;gap:8px 28px;flex-wrap:wrap}
.fact .k{font-size:11px;color:var(--ink-3)}
.fact .v{font-size:18px;font-weight:600}
.hero .progs{display:flex;gap:6px;flex-wrap:wrap}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.done{color:var(--ok)} .status.run{color:var(--accent)}
.status svg{display:none}
@media (max-width:640px){.hero{padding:16px}.hero .ring{width:90px;height:90px}.hero .ring .in b{font-size:32px}.hero .facts{gap:6px 18px}}

/* ---------- séance : programmes et exercices ---------- */
.grp{margin-top:30px}
.grp-h{display:flex;align-items:flex-end;gap:10px;padding:0 2px 10px}
.grp-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;cursor:pointer;color:inherit;text-align:left;min-width:0}
.grp-btn .chev{width:15px;height:15px;flex:none;color:var(--ink-3);transition:transform .18s ease}
.grp-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp-btn h2{font-family:var(--f-d);font-weight:400;font-size:25px;line-height:1.1}
.grp-btn .cat{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:3px}
.grp-h .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding-bottom:3px}
.grp-h .cnt.all{color:var(--ok);font-weight:600}
.bar{height:2px;border-radius:2px;background:var(--line);overflow:hidden;margin:0 2px 12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.consignes{padding:14px 18px;border-bottom:1px solid var(--line)}
.consignes details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.consignes details summary::-webkit-details-marker{display:none}
.consignes details summary::before{content:"+";color:var(--ink-3);width:12px}
.consignes details[open] summary::before{content:"–"}
.consignes .body{display:grid;gap:8px;margin-top:12px}
.blocs{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.blocrow{display:grid;grid-template-columns:28px 64px minmax(0,1fr);gap:2px 12px;align-items:baseline;font-size:13px;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface)}
.blocrow:first-child{border-top:0}
.blocrow .bl{font-family:var(--f-d);font-size:20px;line-height:1;color:var(--ink)}
.blocrow .num{color:var(--ink-3)}
.blocrow .o{grid-column:3;color:var(--ink-3);font-size:12.5px}
@media (max-width:520px){.blocrow{grid-template-columns:24px minmax(0,1fr)}.blocrow .o,.blocrow b{grid-column:2}}

.ex{border-top:1px solid var(--line);padding:18px}
.ex:first-child,.consignes + .ex{border-top:0}
.ex-h{display:flex;gap:14px;align-items:flex-start}
.ex-h .main{min-width:0;flex:1}
.ex-h .t{font-weight:600;font-size:15.5px;line-height:1.35}
.ex-h .meta{font-size:12.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.presc{font-weight:600;color:var(--ink);white-space:nowrap}
.vid{display:inline-flex;align-items:center;gap:4px;font-weight:500;text-decoration:none;color:var(--accent)}
.vid svg{width:12px;height:12px}
.vid:hover{text-decoration:underline}
.tick{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent;transition:background .15s,border-color .15s,color .15s}
.tick svg{width:18px;height:18px}
.tick:hover{border-color:var(--ink-3);color:var(--ink-3)}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ex.is-done .ex-h .t{color:var(--ink-3)}

/* consignes d'exercice : une ligne par rubrique */
.instr{display:grid;grid-template-columns:96px minmax(0,1fr);margin:12px 0 0;max-width:640px;border-top:1px solid var(--line)}
.instr dt,.instr dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.instr dt{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding-top:9px}
.instr dd{color:var(--ink-2)}
.instr dd.strong{color:var(--ink);font-weight:500}
.instr dt.vig{color:var(--warn)}
.instr dd.vig{color:var(--ink)}
@media (max-width:520px){.instr{grid-template-columns:minmax(0,1fr)}.instr dt{border-bottom:0;padding:9px 0 0}.instr dd{padding:1px 0 9px}}

.sets{display:grid;gap:6px;margin-top:14px;max-width:500px}
.setrow{display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr)) 28px;gap:6px;align-items:center}
.setrow .lbl{font-size:12px;color:var(--ink-3);text-align:center}

/* Dans claude.ai : base partagée (téléphone et ordinateur voient les mêmes données).
   Ouvert hors de claude.ai : stockage local du navigateur. */
const store = {
  db:null, mode:'pending', pending:0,
  async init(){
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e){ db = null; }
    this.db = db; this.mode = db ? 'cloud' : 'local'; syncUI();
  },
  async getPlanning(){
    if (this.db){ try { const s = await this.db.doc('config/planning').get(); return s.exists ? (thaw(s.data()) || {}).days || null : null; } catch(e){ return null; } }
    const v = lsGet('pds_planning'); return v && v.days || null;
  },
  async listSessions(){
    if (this.db){
      try { const snap = await this.db.collection('sessions').orderBy('date','desc').limit(1000).get();
        return snap.docs.map(d => thaw(d.data())).filter(s => s && s.id && s.date); }
      catch(e){ this.mode = 'err'; syncUI(); return null; }
    }
    return Object.values(lsGet('pds_sessions') || {});
  },
  q: Promise.resolve(),
  write(path, body){
    if (!this.db){
      if (path === 'config/planning') lsSet('pds_planning', body);
      else { const all = lsGet('pds_sessions') || {}; all[body.id] = body; lsSet('pds_sessions', all); }
      return Promise.resolve(true);
    }
    const copy = thaw(body);
    this.pending++; syncUI();
    this.q = this.q.then(() => this.db.doc(path).set(copy)).then(() => { this.pending--; if (this.mode === 'err') this.mode = 'cloud'; syncUI(); return true; },
      e => { this.pending--; this.mode = 'err'; syncUI(e); return false; });
    return this.q;
  },
};
function syncUI(e){
  const s = store.pending ? 'busy' : store.mode;
  const txt = { pending:'Connexion…', cloud:'Synchronisé', busy:'Enregistrement…', local:'Sur cet appareil', err:(e && e.code === 'invalid_argument') ? 'Lecture seule' : 'Non enregistré' }[s];
  document.querySelectorAll('.sync').forEach(n => { n.dataset.s = s; n.querySelector('.syncTxt').textContent = txt; });
  document.querySelectorAll('[data-save-state]').forEach(n => { n.textContent = s === 'busy' ? 'Enregistrement…' : s === 'err' ? txt : 'Enregistré'; });
}

/* ================= construction des séances ================= */
function prescOf(e){ if (e.rep == null && e.serie == null) return '–'; if (e.serie == null) return String(e.rep); return `${e.serie} × ${e.rep}`; }
function nSets(e){
  const s = Number(e.serie); if (Number.isFinite(s) && s > 0 && s <= 10) return s;
  const m = /^\s*(\d+)\s*[×x]/.exec(String(e.rep == null ? '' : e.rep));
  if (m){ const n = Number(m[1]); if (n > 0 && n <= 10) return n; }
  return 3;
}
/* Temps de repos conseillé, lu dans la consigne de l'exercice puis dans celle du programme. */
function restOf(e){
  if ((PBY[e.prog] || {}).cat === 'Musculation') return settings.restMus;
  const pick = (txt, re) => { const m = re.exec(txt || ''); if (!m) return null; const v = Number(m[1]); return /min/.test(m[2]) ? v * 60 : v; };
  let r = pick(e.desc, /Repos\s*:\s*(\d+)(?:\s*[-–]\s*\d+)?\s*(s|min|')/i);
  if (r == null){ const p = PBY[e.prog]; (p && p.meta || []).some(t => (r = pick(t, /Repos\s*(\d+)(?:\s*[-–]\s*\d+)?\s*(s|min)/i)) != null); }
  if (r == null){ const p = PBY[e.prog]; r = p && p.cat === 'Mobilité' ? 30 : 60; }
  return r;
}
function lastValuesFor(exId, dateStr){
  const past = sessions.filter(s => s && s.done && s.date < dateStr && Array.isArray(s.items)).sort((a, b) => a.date < b.date ? 1 : -1);
  for (const s of past){ const it = s.items.find(i => i.exId === exId); if (it && Array.isArray(it.sets) && it.sets.some(hasVal)) return { date:s.date, sets:it.sets }; }
  return null;
}
function exosFor(slots){
  const out = [];
  sortSlots(slots).forEach(sl => {
    const p = PBY[sl.prog]; if (!p) return;
    let list = EXOS.filter(e => e.prog === sl.prog);
    if (p.cat === 'Mobilité' && sl.sem != null && sl.sem !== '') list = list.filter(e => String(e.sem) === String(sl.sem));
    out.push(...list);
  });
  return out;
}
function blankItem(e, dateStr){
  const prev = lastValuesFor(e.id, dateStr);
  const sets = Array.from({ length: prev ? Math.max(1, prev.sets.length) : nSets(e) }, (_, i) => {
    const p = prev && prev.sets[i]; return p ? { r:p.r || '', c:p.c || '', t:p.t || '' } : { r:'', c:'', t:'' }; });
  return { exId:e.id, sets, douleur:null, done:false, from: prev ? prev.date : null };
}
function newSession(date, slots){
  const d = iso(date);
  return { id:'s_'+d, date:d, week:isoWeek(date), slots:slots.map(s => ({...s})), items:exosFor(slots).map(e => blankItem(e, d)),
           douleur24:null, rpe:null, note:'', done:false, ts:Date.now() };
}
function syncItems(){
  const want = exosFor(session.slots), keep = new Map(session.items.map(i => [i.exId, i]));
  session.items = want.map(e => keep.get(e.id) || blankItem(e, session.date));
}
const isStored = s => sessions.some(x => x.id === s.id);
let saveTimer = null;
function saveSessionSoon(){
  document.querySelectorAll('[data-save-state]').forEach(n => n.textContent = 'Modifié…');
  clearTimeout(saveTimer);
  const s = session;
  saveTimer = setTimeout(() => commitSession(s), 650);
}
function commitSession(s){
  if (!s) return; s.ts = Date.now();
  const i = sessions.findIndex(x => x.id === s.id); if (i >= 0) sessions[i] = s; else sessions.push(s);
  store.write('sessions/' + s.id, s);
}
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; commitSession(session); } }
function loadSession(){
  flushSave();
  const id = 's_' + iso(viewDate);
  const stored = sessions.find(s => s.id === id);
  if (stored) session = stored;
  else session = newSession(viewDate, ((planning[dayKey(viewDate)] || {}).progs || []).map(s => ({...s})));

/* Les consignes arrivent en une ligne (« explication · Tempo : … · Repos : … »).
   On les range par rubrique pour lire d'un coup d'œil le tempo, puis le geste. */
function instrOf(e){
  let tempo = null, repos = null, alt = null, src = null; const expl = [], vig = [];
  String(e.desc || '').split(/\s+·\s+/).filter(Boolean).forEach(sg => {
    let m;
    if ((m = /^Tempo\s*:\s*(.+)$/i.exec(sg))) tempo = m[1];
    else if ((m = /^Repos\s*:\s*(.+)$/i.exec(sg))) repos = m[1];
    else if ((m = /^Alternative[^:]*:\s*(.+)$/i.exec(sg))) alt = m[1];
    else {
      const t = sg.replace(/^Adapté de «\s*([^»]+?)\s*»\.?\s*/i, (_, x) => { src = x; return ''; });
      t.split(/(?<=[.!])\s+(?=[A-ZÀ-ÖØ-Þ«])/).forEach(x => { x = x.trim(); if (x) (/\b(PAS|JAMAIS|STOP|SEULEMENT|ATTENTION)\b/.test(x) ? vig : expl).push(x); });
    }

  if (tempo) rows.push(['Tempo', cap1(tempo), 'strong']);

/* ================= graphiques ================= */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(t, a){ const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; }
/* Sur téléphone, un repère plus étroit garde des libellés lisibles. */
const chartW = () => window.innerWidth < 560 ? 360 : 520;
function chartCard(title, cap){ const c = el('div','card chart'); c.append(el('h3', null, title), el('div','cap', cap)); return c; }
function noData(c, txt){ const e = el('div','empty'); e.style.padding = '26px 8px'; e.append(document.createTextNode(txt || 'Les données apparaîtront après ta première séance terminée.')); c.append(e); return c; }
/* Maximum d'axe divisible en 4 graduations rondes (1, 2, 5 × 10^n). */
function niceMax(v){ if (v <= 0) return 4; const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p * 4; }
function barChart(card, data, opts){
  opts = opts || {};
  const W = chartW(), H = 200, ml = 34, mr = 8, mt = 12, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const max = niceMax(Math.max(opts.min || 1, ...data.map(d => d.v)));
  const s = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':card.querySelector('h3').textContent });
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, y = mt + ih - ih * i / 4;
    s.append(svgEl('line', { x1:ml, x2:W-mr, y1:y, y2:y, stroke:'var(--line)', 'stroke-width':1, 'stroke-dasharray': i ? '2 3' : '' }));
    const tx = svgEl('text', { x:ml-7, y:y+3.5, 'text-anchor':'end', fill:'var(--ink-3)', 'font-size':10, 'font-family':'Instrument Sans, sans-serif' }); tx.textContent = Math.round(v * 10) / 10; s.append(tx); }
  const slot = iw / data.length, bw = Math.max(6, Math.min(30, slot - 8));
  data.forEach((d, i) => {
    const x = ml + slot * (i + .5) - bw / 2, bh = d.v / max * ih, last = i === data.length - 1;
    const g = svgEl('g', {});
    g.append(svgEl('rect', { x, y:mt+ih-bh, width:bw, height:Math.max(bh, d.v > 0 ? 2 : 0), rx:4, fill:'var(--accent)', opacity: last ? 1 : .55 }));
    g.append(svgEl('rect', { x:ml + slot * i, y:mt, width:slot, height:ih, fill:'transparent' }));
    g.addEventListener('pointerenter', ev => showTip(card, ev, `${d.l} · ${d.v}${opts.unit || ''}`)); g.addEventListener('pointerleave', () => hideTip(card));
    s.append(g);
    if (d.v > 0 && data.length <= 12){ const vt = svgEl('text', { x:x + bw/2, y:mt+ih-bh-5, 'text-anchor':'middle', fill:'var(--ink-2)', 'font-size':10, 'font-family':'Instrument Sans, sans-serif' }); vt.textContent = d.v; s.append(vt); }
    const t = svgEl('text', { x:ml + slot * (i + .5), y:H-8, 'text-anchor':'middle', fill: last ? 'var(--ink)' : 'var(--ink-3)', 'font-size':10, 'font-family':'Instrument Sans, sans-serif' }); t.textContent = d.s || d.l; s.append(t);
  });
  card.append(s); addTip(card); return card;
}
function lineChart(card, data, opts){
  opts = opts || {};
  const W = chartW(), H = 200, ml = 34, mr = 14, mt = 18, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  const vals = data.map(d => d.v);
  const max = opts.max != null ? opts.max : niceMax(Math.max(1, ...vals)), min = opts.min != null ? opts.min : 0;
  const X = i => data.length === 1 ? ml + iw / 2 : ml + iw * i / (data.length - 1);
  const Y = v => mt + ih - (v - min) / (max - min || 1) * ih;
  const s = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':card.querySelector('h3').textContent });
  if (opts.band){ s.append(svgEl('rect', { x:ml, y:Y(opts.band[1]), width:iw, height:Y(opts.band[0]) - Y(opts.band[1]), fill:'var(--ok)', opacity:.08 }));
    const bt = svgEl('text', { x:W-mr, y:Y(opts.band[1]) - 4, 'text-anchor':'end', fill:'var(--ok)', 'font-size':9.5, 'font-family':'Instrument Sans, sans-serif' }); bt.textContent = opts.bandLabel || ''; s.append(bt); }
  for (let i = 0; i <= 4; i++){ const v = min + (max - min) * i / 4, y = Y(v);
    s.append(svgEl('line', { x1:ml, x2:W-mr, y1:y, y2:y, stroke:'var(--line)', 'stroke-width':1, 'stroke-dasharray': i ? '2 3' : '' }));
    const t = svgEl('text', { x:ml-7, y:y+3.5, 'text-anchor':'end', fill:'var(--ink-3)', 'font-size':10, 'font-family':'Instrument Sans, sans-serif' }); t.textContent = Math.round(v * 10) / 10; s.append(t); }
  const d = data.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  s.append(svgEl('path', { d: d + ` L${X(data.length-1).toFixed(1)},${mt+ih} L${X(0).toFixed(1)},${mt+ih} Z`, fill:'var(--accent)', opacity:.1 }));
  s.append(svgEl('path', { d, fill:'none', stroke:'var(--accent)', 'stroke-width':2.2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }));
  const every = Math.ceil(data.length / 6);
  data.forEach((p, i) => {
    const last = i === data.length - 1;
    s.append(svgEl('circle', { cx:X(i), cy:Y(p.v), r:last ? 5 : 3, fill:last ? 'var(--accent)' : 'var(--surface)', stroke:'var(--accent)', 'stroke-width':2 }));
    const hw = data.length > 1 ? iw / (data.length - 1) / 2 : iw / 2;
    const hit = svgEl('rect', { x:X(i)-hw, y:mt, width:hw*2, height:ih, fill:'transparent' });
    hit.addEventListener('pointerenter', ev => showTip(card, ev, `${p.l} · ${p.v}${opts.unit || ''}`)); hit.addEventListener('pointerleave', () => hideTip(card)); s.append(hit);
    if (i % every === 0 || last){ const t = svgEl('text', { x:X(i), y:H-8, 'text-anchor': data.length === 1 ? 'middle' : i === 0 ? 'start' : last ? 'end' : 'middle', fill:'var(--ink-3)', 'font-size':10, 'font-family':'Instrument Sans, sans-serif' }); t.textContent = p.s || p.l; s.append(t); }
  });
  const lp = data[data.length-1];
  const lbl = svgEl('text', { x:X(data.length-1) - (data.length > 1 ? 0 : -8), y:Y(lp.v) - 11, 'text-anchor': data.length > 1 ? 'end' : 'start', fill:'var(--ink)', 'font-size':12, 'font-weight':600, 'font-family':'Instrument Sans, sans-serif' });
  lbl.textContent = lp.v + (opts.unit || ''); s.append(lbl);
  card.append(s); addTip(card); return card;
}
function addTip(card){ if (!card.querySelector('.tip')) card.append(el('div','tip')); }
function showTip(card, ev, text){ const t = card.querySelector('.tip'); if (!t) return; const r = card.getBoundingClientRect();
  t.textContent = text; t.style.opacity = '1'; t.style.left = Math.min(Math.max(8, ev.clientX - r.left - 50), r.width - 150) + 'px'; t.style.top = Math.max(4, ev.clientY - r.top - 36) + 'px'; }
function hideTip(card){ const t = card.querySelector('.tip'); if (t) t.style.opacity = '0'; }

      top.append(el('span', null, c)); const n = el('span','num', byCat[c] + ' · ' + Math.round(byCat[c] / tot * 100) + ' %'); n.style.color = 'var(--ink-2)'; top.append(n);
      const b = el('div','bar'); b.style.cssText = 'height:8px;margin:0'; const i = el('i'); i.style.width = (byCat[c] / tot * 100) + '%'; i.style.background = `var(${CAT_VAR[c] || '--accent'})`; b.append(i);
      row.append(top, b); g.append(row); });
    c6.append(g); } else noData(c6);
  ch.append(c6);
  r.append(ch);

  const sh = el('div','sh'); sh.append(el('h2', null, 'Séances')); sh.append(el('span','hint','Touche une séance pour la rouvrir')); r.append(sh);
  const list = el('div','card');
  if (!done.length){ const e = el('div','empty'); e.append(el('strong', null, 'Rien encore')); e.append(document.createTextNode('Termine une séance dans l’onglet Séance et elle apparaîtra ici.')); list.append(e); }
  else done.slice(0, 120).forEach(s => {
    const row = el('button','sess'); row.type = 'button';
    const dt = el('div','dt'); const dd = parseISO(s.date); dt.append(el('b', null, String(dd.getDate()).padStart(2,'0')), document.createTextNode(dd.toLocaleDateString('fr-FR',{ month:'short', year:'2-digit' }))); row.append(dt);
    const mid = el('div'); mid.style.minWidth = '0';
    mid.append(el('div','ti', s.slots.map(x => (PBY[x.prog] || {}).label).filter(Boolean).join(' · ') || 'Séance libre'));
    const mi = el('div','mi'); const items = s.items.filter(i => EBY[i.exId]);
    mi.append(el('span', null, cap1(dd.toLocaleDateString('fr-FR',{ weekday:'long' }))), el('span', null, items.filter(i => i.done).length + '/' + items.length + ' exercices'), el('span', null, nSeries(s) + ' séries'));
    if (s.rpe != null) mi.append(el('span', null, 'RPE ' + s.rpe));
    if (s.note) mi.append(el('span', null, '« ' + (s.note.length > 40 ? s.note.slice(0, 40) + '…' : s.note) + ' »'));
    mid.append(mi); row.append(mid);
    const right = el('div');
    if (s.douleur24 != null){ const c = el('span','chip line'); const d = el('span','dot'); d.style.background = painColor(s.douleur24); c.append(d, document.createTextNode(s.douleur24 + '/10')); right.append(c); }
    row.append(right);
    row.onclick = () => { viewDate = parseISO(s.date); loadSession(); go('sess'); };
    list.append(row);
  });
  r.append(list);
}

/* ================= RÈGLES ================= */
function renderRules(){
  const r = $('#p-rules'); r.innerHTML = '';
  const ph = el('div','ph'); const t = el('div'); t.append(el('span','eyebrow','Le cadre du plan'), el('h1', null, 'Règles')); ph.append(t); r.append(ph);
  const painIdx = REGLES.findIndex(x => /^Douleur/i.test(x.r));
  const base = painIdx < 0 ? REGLES : REGLES.slice(0, painIdx), signals = painIdx < 0 ? [] : REGLES.slice(painIdx);
  let sh = el('div','sh'); sh.append(el('h2', null, 'Non négociables'), el('span','hint', base.length + ' règles')); r.append(sh);
  const list = el('div','rules');
  base.forEach((x, i) => { const c = el('div','card rule'); c.append(el('span','n', String(i+1)), el('b', null, x.r), el('p', null, x.d)); list.append(c); });
  r.append(list);
  if (signals.length){
    sh = el('div','sh'); sh.append(el('h2', null, 'Lire les signaux du corps'), el('span','hint','Que faire selon ce que tu ressens')); r.append(sh);
    const tr = el('div','traffic');
    signals.forEach(x => {
      const lvl = /≤\s*3|normale/i.test(x.r) ? ['var(--ok)','Feu vert'] : /élevée|AUGMENTE|Perte/i.test(x.r) ? ['var(--crit)','Stop / adapter'] : ['var(--warn)','Attention'];
      const c = el('div','card tl'); const lv = el('div','lv'); const i = el('i'); i.style.background = lvl[0]; lv.style.color = lvl[0]; lv.append(i, document.createTextNode(lvl[1]));
      c.append(lv, el('b', null, x.r), el('p', null, x.d)); tr.append(c); });
    r.append(tr);
  }
  sh = el('div','sh'); sh.append(el('h2', null, 'Étapes de rééducation'), el('span','hint','Durée, fréquence, progression')); r.append(sh);
  const et = el('div','etapes');
  PROGS.filter(p => p.cat === 'Rééducation').forEach(p => {
    const c = el('div','card etape'); c.append(el('h3', null, p.label));
    (p.meta || []).forEach((txt, i) => { if (i === 0){ const m = el('div','num', txt); m.style.cssText = 'font-size:12.5px;color:var(--ink-2)'; c.append(m); } else { const pp = el('p', null, txt); pp.style.cssText = 'margin:0;font-size:13.5px;color:var(--ink-2)'; c.append(pp); } });
    if (p.blocs && p.blocs.length) c.append(blocList(p.blocs));
    const items = EXOS.filter(e => e.prog === p.id).sort((a, b) => a.ord - b.ord);
    const d = el('details'); const sm = el('summary', null, 'Les ' + items.length + ' items de la séance'); sm.style.cssText = 'cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-deep)'; d.append(sm);
    const ol = el('ol'); ol.style.cssText = 'margin:10px 0 0;padding-left:20px;display:grid;gap:5px;font-size:13px;color:var(--ink-2)';
    items.forEach(e => { const li = el('li'); const b = el('span', null, e.nom); b.style.color = 'var(--ink)'; li.append(b, document.createTextNode(' · ' + prescOf(e) + (e.cible ? ' · ' + e.cible : ''))); ol.append(li); });
    d.append(ol); c.append(d); et.append(c);
  });
  r.append(et);
}

/* ================= export / import / réglages ================= */
async function exportData(){
  flushSave();
  const payload = { app:'carnet-de-reprise', version:2, exported:new Date().toISOString(), planning,
    sessions:sessions.filter(s => s.done || s.items.some(i => i.done || i.sets.some(hasVal))) };
  lsSet('pds_lastExport', Date.now()); const bk = document.getElementById('backupNag'); if (bk) bk.remove();
  const json = JSON.stringify(payload, null, 2), filename = `programme-de-sport-${iso(new Date())}.json`;
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e){ dl = null; }
  if (dl){ try { await dl.save({ filename, data:json }); } catch(e){ if (e && e.code !== 'declined') toast('Export impossible : ' + (e.message || e.code)); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type:'application/json' })); a.download = filename; document.body.append(a); a.click(); a.remove(); }
  catch(e){ toast('Export indisponible dans cette vue'); }
}
function importData(){ const f = $('#importFile'); f.value = ''; f.click(); }
$('#importFile').onchange = async ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch(e){ toast('Fichier illisible : choisis un export JSON de l’application.'); return; }
  const inc = Array.isArray(data.sessions) ? data.sessions.filter(s => s && s.id && s.date && Array.isArray(s.items)) : [];
  const { box, close } = sheet('Importer', 'Restaurer une sauvegarde');
  const p = el('p', null, `${inc.length} séance(s)${data.planning ? ' et une semaine type' : ''} trouvée(s) dans « ${file.name} ». Pour une même date, la version la plus récente est gardée.`);
  p.style.cssText = 'margin:0 0 12px;font-size:14px;color:var(--ink-2)'; box.append(p);
  const lab = el('label','opt'); const cb = el('input'); cb.type = 'checkbox'; cb.id = 'impPlan'; cb.checked = !!data.planning; cb.disabled = !data.planning;
  const d = el('div'); d.append(el('div','t','Remplacer aussi la semaine type'), el('div','m','Sinon, seul l’historique des séances est importé.')); lab.append(cb, d); box.append(lab);
  const foot = el('div','sheet-foot'); const c = el('button','btn ghost','Annuler'); c.type = 'button'; c.onclick = close;
  const ok = el('button','btn','Importer'); ok.type = 'button';
  ok.onclick = async () => {
    ok.disabled = true; let n = 0;
    for (const s of inc){ const cur = sessions.find(x => x.id === s.id); if (!cur || (s.ts || 0) >= (cur.ts || 0)){ const i = sessions.findIndex(x => x.id === s.id); if (i >= 0) sessions[i] = s; else sessions.push(s); await store.write('sessions/' + s.id, s); n++; } }
    if (cb.checked && data.planning){ planning = data.planning; await store.write('config/planning', { days:planning }); }
    close(); loadSession(); go(tab, true); toast(n + ' séance(s) importée(s)');
  };
  foot.append(c, ok); box.append(foot);
};
function openTheme(){
  const cur = currentTheme(); const { box, close } = sheet('Apparence', 'Thème');
  THEMES.forEach(th => {
    const lab = el('label','opt theme-opt'); const r = el('input'); r.type = 'radio'; r.name = 'theme'; r.id = 'th_' + th.id; r.checked = th.id === cur;
    const sw = el('span','sw'); th.sw.forEach(c => { const d = el('span'); d.style.background = c; sw.append(d); });
    const nm = el('div'); nm.style.flex = '1'; nm.append(el('div','t', th.nom)); if (th.m) nm.append(el('div','m', th.m));
    r.onchange = () => { applyTheme(th.id); if (tab === 'hist') renderHist(); };
    lab.append(r, sw, nm); box.append(lab);
  });
  const foot = el('div','sheet-foot'); const b = el('button','btn','Fermer'); b.type = 'button'; b.onclick = close; foot.append(b); box.append(foot);
}
function openMenu(){
  const { box, close } = sheet('Réglages', 'Données et apparence');
  const info = el('div','banner info'); info.innerHTML = svgI(ICON.info);
  info.append(el('span', null, store.mode === 'local' ? 'Tes données sont enregistrées sur cet appareil. Pense à exporter régulièrement une sauvegarde.' : 'Tes données sont synchronisées : retrouve-les sur ton téléphone et ton ordinateur en ouvrant ce même lien.'));
  box.append(info);
  const g = el('div','stack'); g.style.marginTop = '14px';
  [['Thème', 'Clair, sombre, bleu nuit, rouge, noir rétro', () => { close(); openTheme(); }],
   ['Minuteur', 'Repos, chrono et signal sonore', () => { close(); openTimer(); }],
   ['Exporter les données', 'Sauvegarde JSON de la semaine type et des séances', () => { close(); exportData(); }],
   ['Importer une sauvegarde', 'Restaure un export JSON', () => { close(); importData(); }]].forEach(([t, m, fn]) => {
    const b = el('button','opt'); b.type = 'button'; b.style.cssText = 'width:100%;text-align:left;background:var(--surface);font:inherit;color:inherit;margin:0';
    const d = el('div'); d.append(el('div','t', t), el('div','m', m)); b.append(d); b.onclick = fn; g.append(b); });
  box.append(g);
  const foot = el('div','sheet-foot'); const b = el('button','btn','Fermer'); b.type = 'button'; b.onclick = close; foot.append(b); box.append(foot);
}
$('#sbExport').onclick = exportData; $('#sbImport').onclick = importData; $('#sbTheme').onclick = openTheme;
$('#mMenu').onclick = openMenu; $('#mTimer').onclick = openTimer;

/* ================= démarrage ================= */
async function refresh(){
  const [cfg, list] = await Promise.all([store.getPlanning(), store.listSessions()]);
  if (cfg) planning = cfg;
  if (list){
    const local = new Map(sessions.map(s => [s.id, s]));
    sessions = list.map(s => { const l = local.get(s.id); return l && (l.ts || 0) > (s.ts || 0) ? l : s; });
    local.forEach((s, id) => { if (!sessions.some(x => x.id === id)) sessions.push(s); });
  }
}
async function boot(){
  $('#sideDate').textContent = cap1(new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'short' }));
  buildNav();
  const want = (location.hash || '').replace('#','') || lsGet('pds_tab') || 'sess';
  go(RENDER[want] ? want : 'sess');
  await store.init();
  await refresh();
  loaded = true;
  if (session && session.id === 's_' + iso(viewDate)) session = null;
  loadSession();
  RENDER[tab]();
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden){ flushSave(); return; }
    if (document.activeElement && document.activeElement.closest('input,textarea')) return;
    if (store.pending) return;
    const before = JSON.stringify(session);
    await refresh();
    const fresh = sessions.find(s => s.id === session.id);
    if (fresh && JSON.stringify(fresh) !== before){ session = fresh; }
    if (!document.querySelector('.sheet')) RENDER[tab]();
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); if (RENDER[h] && h !== tab) go(h); });
}
/* ================= application installée ================= */
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
function backupNag(){
  if (document.getElementById('backupNag')) return;
  const n = sessions.filter(s => s && (s.done || (s.items || []).some(i => i.done))).length; if (!n) return;
  const last = lsGet('pds_lastExport') || 0, days = Math.floor((Date.now() - last) / 86400000);
  if (last && days < 7) return;
  const b = el('div','banner warn'); b.id = 'backupNag'; b.style.margin = '12px 0 0'; b.innerHTML = svgI(ICON.warn);
  const t = el('span', null, (last ? 'Dernière sauvegarde il y a ' + days + ' jours. ' : 'Aucune sauvegarde pour l’instant. ') + 'Tes données ne sont que sur cet appareil.');
  const a = el('button','btn sm','Exporter'); a.type = 'button'; a.style.marginLeft = 'auto'; a.onclick = exportData;
  b.style.alignItems = 'center'; b.append(t, a); $('.page').prepend(b);
}
boot().then(backupNag).catch(e => { const b = el('div','banner crit'); b.style.margin = '16px 0'; b.textContent = 'Démarrage impossible : ' + (e && e.message || e); $('.page').prepend(b); });
</script>
